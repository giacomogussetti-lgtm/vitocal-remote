name: Cloud Command Executor (Vitocal & BTicino)

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Nome comando (es. viessmann_curve, bticino_setpoint, preset_sync_pulse)"
        required: true
        type: string
      payload_json:
        description: "Parametri comando in JSON"
        required: false
        default: "{}"
        type: string

concurrency:
  group: vitocal-command
  cancel-in-progress: false

jobs:
  execute-command:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic PyViCare python-dotenv

      - name: Execute Command & Log Snapshot
        id: run_cmd
        env:
          VIESSMANN_USER: ${{ secrets.VIESSMANN_USER }}
          VIESSMANN_PASSWORD: ${{ secrets.VIESSMANN_PASSWORD }}
          VIESSMANN_CLIENT_ID: ${{ secrets.VIESSMANN_CLIENT_ID }}
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ID: ${{ secrets.CRONJOB_ID }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          WEATHER_ELEVATION_M: ${{ secrets.WEATHER_ELEVATION_M }}
          CMD_ACTION: ${{ inputs.command }}
          CMD_PAYLOAD_JSON: ${{ inputs.payload_json }}
        run: |
          set +e
          python scripts/cloud_commander.py
          CMD_EXIT=$?
          echo "cmd_exit=$CMD_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Commit & Push Command Receipt and Telemetry
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/git_safe_push.py \
            --mode command \
            --message "chore(command): execute ${{ inputs.command }} [skip ci]" \
            --files data/last_command.json data/autopilot_config.json data/autopilot_state.json data/thermal_model.json data/weather_forecast.json data/cloud_telemetry.jsonl data/archive

      - name: Enforce Command Exit Status
        if: steps.run_cmd.outputs.cmd_exit != '0'
        run: |
          echo "Comando fallito (exit=${{ steps.run_cmd.outputs.cmd_exit }}). Controlla data/last_command.json per i dettagli."
          exit 1
