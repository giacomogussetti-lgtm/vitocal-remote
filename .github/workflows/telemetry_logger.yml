name: Telemetry Cloud Logger (Vitocal & BTicino)

on:
  workflow_dispatch: # Attivato con precisione al secondo da cron-job.org o dall'app mobile

concurrency:
  group: telemetry-logger
  cancel-in-progress: false

jobs:
  log-telemetry:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pydantic PyViCare python-dotenv

      - name: Query Telemetry & Append Log
        env:
          VIESSMANN_USER: ${{ secrets.VIESSMANN_USER }}
          VIESSMANN_PASSWORD: ${{ secrets.VIESSMANN_PASSWORD }}
          VIESSMANN_CLIENT_ID: ${{ secrets.VIESSMANN_CLIENT_ID }}
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_ID: ${{ secrets.CRONJOB_ID }}
        run: |
          python scripts/cloud_logger.py

      - name: Commit & Push New Samples
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/git_safe_push.py \
            --mode telemetry \
            --message "chore(telemetry): record cloud sample [skip ci]" \
            --files data/cloud_telemetry.jsonl data/autopilot_state.json data/archive
